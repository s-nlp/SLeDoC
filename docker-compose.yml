services:
  viewers:
    build: .
    ports:
      - "7860:7860"
    volumes:
      - ./nli.py:/app/nli.py:ro
      - ./semantic_mismatch.py:/app/semantic_mismatch.py:ro
      - ./nli_test.jsonl:/app/nli_test.jsonl:ro
      - ./pairs.json:/app/pairs.json:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 7860
    restart: unless-stopped